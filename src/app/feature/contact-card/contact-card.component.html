<div class="contact-card-container">

  <p class="required-note" translate="app.CONTACT.REQUIRED-VALUES"></p>

  <form class="form" novalidate [formGroup]="newEmail" [target]="newEmail" #formDirective="ngForm"
    (ngSubmit)="sendEmail($event.target, formDirective)">

    <div class="field">
      <label translate="app.CONTACT.NAME"></label>
      <input matInput [formControl]="name" required name="name" [placeholder]="'app.CONTACT.NAME' | translate" />
      <span class="field-error" *ngIf="name.invalid && name.touched" translate="app.CONTACT.INVALID-NAME"></span>
    </div>

    <div class="field">
      <label>Email*</label>
      <input matInput type="email" [formControl]="email" required name="email" placeholder="tu@email.com" />
      <span class="field-error" *ngIf="email.invalid && email.touched">{{ getErrorMessage() }}</span>
    </div>

    <div class="field">
      <label translate="app.CONTACT.MESSAGE"></label>
      <textarea [formControl]="message" name="message" #msg maxlength="256" rows="4"
        [placeholder]="'app.CONTACT.INTRODUCE' | translate"></textarea>
      <span class="field-hint">{{ msg.value.length }} / 256</span>
    </div>

    <div class="form-footer">
      <span class="success-msg" *ngIf="success" translate="app.CONTACT.EMAIL-SUCCESS"></span>
      <span class="error-msg" *ngIf="error" translate="app.CONTACT.EMAIL-WRONG"></span>
      <button class="send-btn" [disabled]="!newEmail.valid" type="submit">
        <mat-spinner [diameter]="20" *ngIf="loading; else sendLabel"></mat-spinner>
        <ng-template #sendLabel><span translate="app.CONTACT.SEND"></span></ng-template>
      </button>
    </div>

  </form>

</div>
