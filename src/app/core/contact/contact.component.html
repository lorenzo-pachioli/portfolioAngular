<section class="contact-container">

  <h1 translate="app.HEADER.CONTACT"></h1>
  <hr />

  <div class="contact-stage">

    <div class="contact-grid">

      <div class="contact-glass-card">
        <p class="form-intro" translate="app.CONTACT.LABEL"></p>
        <app-contact-card></app-contact-card>
      </div>

      <div class="contact-side">

        <div class="neon-frame">
          <span class="frame-label" translate="app.CONTACT.LABEL2"></span>
          <div class="social-links">
            <a href="https://www.linkedin.com/in/lorenzo-pachioli/" target="_blank" rel="noopener noreferrer">
              <img [src]="svgLinkedin" alt="LinkedIn" />
            </a>
            <a href="https://github.com/lorenzo-pachioli" target="_blank" rel="noopener noreferrer">
              <img [src]="github" alt="GitHub" />
            </a>
          </div>
        </div>

        <div class="neon-frame">
          <span class="frame-label" translate="app.CONTACT.CV"></span>
          <a class="cv-link" [href]="linkCv" target="_blank" rel="noopener noreferrer">
            <mat-icon color="accent">attach_file</mat-icon>
          </a>
        </div>

      </div>
    </div>
  </div>

</section>
